<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Medicine Examination</title>

    <meta name="description"
          content="Offline Community Medicine Examination Presentation System">

    <!-- CSS -->

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/exam.css">

    <!-- Print / PDF export styles (self-contained, does not
         depend on the CSS files above) -->
    <style>

        #print-area {
            display: none;
            font-size: 12px;
        }

        #print-area h1 { font-size: 20px; }
        #print-area h2 { font-size: 16px; }
        #print-area h3 { font-size: 14px; }

        .print-section {
            page-break-inside: avoid;
            margin-bottom: 24px;
        }

        .print-spotter-station {
            page-break-inside: avoid;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #ccc;
        }

        .print-question-item {
            margin: 8px 0;
        }

        .print-marks {
            font-style: italic;
            color: #555;
        }

        .print-answer-key {
            margin: 12px 0 0 0;
            padding: 10px 12px;
            border-left: 4px solid #4a90e2;
            background: #f7fbff;
            color: #333;
        }

        .print-answer-key strong {
            display: block;
            margin-bottom: 6px;
        }

        .print-answer-key div {
            margin: 4px 0;
        }

        .print-image img {
            max-width: 320px;
            display: block;
            margin: 8px 0;
        }

        .print-image-caption {
            font-size: 0.85em;
            color: #555;
        }

        .print-page {
            page-break-after: always;
            page-break-inside: avoid;
        }

        .print-page:last-child {
            page-break-after: auto;
        }

        @media print {

            body * {
                visibility: hidden;
            }

            #print-area,
            #print-area * {
                visibility: visible;
            }

            #print-area {
                display: block;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }

        }

    </style>

</head>

<body>

    <!-- =====================================================
         APPLICATION CONTAINER
         ===================================================== -->

    <div id="app">

        <!-- Header -->

        <!-- Single bar: branding on home/summary screens, section title
             + timers during the exam (toggled by .exam-mode) -->

        <header id="app-header">

            <div class="app-brand">

                <h1>Community Medicine</h1>

                <h2>Examination Presentation System</h2>

            </div>

            <div class="app-exam-title" id="examTitle"></div>

            <div class="app-timers">

                <div class="timer-box">

                    <div class="timer-label">Overall Timer</div>

                    <div id="overallTimer" class="timer-value">00:00</div>

                </div>

                <div class="timer-box">

                    <div class="timer-label">Section Timer</div>

                    <div id="sectionTimer" class="timer-value">00:00</div>

                </div>

            </div>

        </header>

        <!-- Main content rendered by JavaScript -->

        <main id="app-content">

            <!-- Home Screen will be injected here -->

        </main>

        <!-- Footer -->

        <footer id="app-footer">

            <div class="footer-left">
                <small>Version 1.2</small>
            </div>

            <div class="footer-right">
                <small>Developed by Dr. Mukul Maheshwari</small>
            </div>

        </footer>

    </div>

    <!-- Hidden container populated only when printing -->
    <div id="print-area"></div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/config.js"></script>
    <script src="data/data-embedded.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/password.js"></script>
    <script src="js/usage-log.js"></script>

    <script src="js/views/home.js"></script>
    <script src="js/views/admin.js"></script>
    <script src="js/views/clinical.js"></script>
    <script src="js/views/epidemiology.js"></script>
    <script src="js/views/biostatistics.js"></script>
    <script src="js/views/ospe.js"></script>
    <script src="js/views/spotter.js"></script>
    <script src="js/views/summary.js"></script>
    <script src="js/print.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
