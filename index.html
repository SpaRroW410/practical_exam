<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practical Exam Review</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Interactive practice assessment</p>
          <h1>Practical Exam Review</h1>
          <p class="subtitle">Sharpen your recall across clinical, epidemiology, biostatistics, OSPE, and spotter stations.</p>
        </div>
        <div class="timer-card" aria-live="polite">
          <span>Time left</span>
          <strong id="timer">15:00</strong>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <section class="panel stats-panel">
            <h2>Exam Progress</h2>
            <div class="stats-grid">
              <div>
                <span class="stat-label">Answered</span>
                <strong id="answeredCount">0</strong>
              </div>
              <div>
                <span class="stat-label">Remaining</span>
                <strong id="remainingCount">0</strong>
              </div>
            </div>
            <div class="progress-track" aria-hidden="true">
              <div id="progressBar" class="progress-bar"></div>
            </div>
            <p class="helper-text">Progress updates as you answer each question.</p>
          </section>

          <section class="panel">
            <h2>Categories</h2>
            <div id="categoryList" class="category-list"></div>
          </section>
        </aside>

        <section class="content">
          <div id="loader" class="loader">Loading questions…</div>
          <div id="questionCard" class="panel question-panel" hidden></div>

          <div class="controls">
            <button id="prevBtn" class="secondary">Previous</button>
            <button id="nextBtn" class="secondary">Next</button>
            <button id="submitBtn" class="primary">Finish Exam</button>
          </div>
        </section>
      </main>
    </div>

    <div id="resultModal" class="modal" hidden>
      <div class="modal-card">
        <h2>Your Result</h2>
        <p id="resultSummary"></p>
        <ul id="resultList" class="result-list"></ul>
        <button id="closeModal" class="primary">Start Again</button>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
